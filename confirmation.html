<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmation | AUREST</title>
    <link rel="stylesheet" href="css/style.css?v=rooms-receipts-1" />
  </head>
  <body data-nav="rooms">
    <header id="site-header"></header>
    <main id="main">
      <ol class="steps" aria-label="Booking progress">
        <li><b>01</b>Guest &amp; stay details</li>
        <li><b>02</b>Review reservation</li>
        <li aria-current="step"><b>03</b>Confirmation</li>
      </ol>
      <section class="confirm" id="confirm" hidden aria-labelledby="c-title">
        <div class="check-badge" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="46"
            height="46"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m5 12.5 4.5 4.5L19 7.5" />
          </svg>
        </div>
        <div class="eyebrow" id="c-eyebrow">A warm welcome awaits</div>
        <h1 id="c-title">Your stay is all set.</h1>
        <p class="lead" id="c-lead">We look forward to welcoming you to AUREST.</p>
        <p class="ref">Booking reference: <b id="c-ref"></b> <span id="c-status"></span></p>
        <p class="notice" id="c-note" role="status"></p>

        <article class="confirm-card" aria-label="Reservation details">
          <img id="c-img" src="" alt="" />
          <h2 id="c-room"></h2>
          <p class="sub" id="c-meta"></p>
          <div id="room-breakdown"></div>
          <div class="sum-row"><span>Check-in</span><b id="c-in"></b></div>
          <div class="sum-row"><span>Check-out</span><b id="c-out"></b></div>
          <div class="sum-row"><span>Guests</span><b id="c-guests"></b></div>
          <div class="sum-row"><span id="c-calc"></span><span id="c-sub"></span></div>
          <div class="sum-row total"><span>Total room charge</span><span id="c-total"></span></div>
        </article>

        <div class="confirm-actions">
          <span id="receipt-action"></span>
          <a class="btn" href="my-bookings.html">View my bookings</a>
          <a class="btn-outline" href="index.html#home">Back to home</a>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <!-- Load shared data and helpers before the script for this page; script order matters. -->
    <script src="js/data.js?v=rooms-receipts-1"></script>
    <script src="js/app.js?v=rooms-receipts-1"></script>
    <script src="js/finance.js?v=rooms-receipts-1"></script>
    <script src="js/confirmation.js?v=rooms-receipts-1"></script>
  </body>
</html>
